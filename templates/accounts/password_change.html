{% extends "base.html" %}
{% block title %}Изменить пароль{% endblock %}
{% block content %}
<div class="form-page narrow">
<div class="form-intro"><div class="eyebrow">БЕЗОПАСНОСТЬ</div><h1>Изменить пароль</h1></div>
<form method="post" class="form-card">
{% csrf_token %}
{{ form.non_field_errors }}
{% for field in form %}
<label>{{ field.label }}</label>{{ field }}{{ field.errors }}
{% endfor %}
<button class="btn full" type="submit">Изменить пароль →</button>
</form>
</div>
{% endblock %}
