{% extends "base.html" %}
{% block title %}Удаление темы - BEE TEST{% endblock %}
{% block content %}
<div class="center-card">
    <div class="eyebrow">ПОДТВЕРЖДЕНИЕ</div>
    <h1>Удалить тему?</h1>
    <p><b>{{ topic.title }}</b></p>
    <p>Вопросы не удалятся, но останутся без темы.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn danger" type="submit">Да, удалить</button>
        <a class="btn btn-outline" href="{% url 'topics' %}">Отмена</a>
    </form>
</div>
{% endblock %}
